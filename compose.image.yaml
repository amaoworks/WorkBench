# Standalone Compose file for a published Workbench image. Run from the bundle root:
# docker compose -f compose.image.yaml up -d
name: workbench

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  workbench:
    image: ${WORKBENCH_IMAGE:-ghcr.io/amaoworks/workbench}:${WORKBENCH_VERSION:?Set WORKBENCH_VERSION to a published release tag}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WORKBENCH_DATA: /data/data.db
      WORKBENCH_DB_DRIVER: ${WORKBENCH_DB_DRIVER:-postgres}
      WORKBENCH_DATABASE_URL: ${WORKBENCH_DATABASE_URL-postgresql://${POSTGRES_USER:-workbench}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-workbench}?sslmode=disable}
      WORKBENCH_ALLOW_INSECURE_HTTP: "true"
      WORKBENCH_ALLOWED_HOSTS: ${WORKBENCH_ALLOWED_HOSTS:-localhost:${WORKBENCH_HOST_PORT:-8080},127.0.0.1:${WORKBENCH_HOST_PORT:-8080}}
    ports:
      - "127.0.0.1:${WORKBENCH_HOST_PORT:-8080}:8080"
    volumes:
      - workbench_data:/data
      # Enable the matching .env paths before mounting provider credentials.
      # - ./secrets/AuthKey.p8:/run/secrets/workbench/apns.p8:ro
      # - ./secrets/fcm-service-account.json:/run/secrets/workbench/fcm-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    logging: *logging

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-workbench}", "-d", "${POSTGRES_DB:-workbench}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging: *logging

volumes:
  workbench_data:
  postgres_data:
