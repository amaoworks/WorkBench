# Standalone Compose file for a published Workbench image. Run from the bundle root:
# docker compose -f compose.image.yaml up -d
services:
  workbench:
    image: ${WORKBENCH_IMAGE:-ghcr.io/amaoworks/workbench}:${WORKBENCH_VERSION:?Set WORKBENCH_VERSION to a published release tag}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8080}:${WORKBENCH_HTTP_PORT:-8080}"
    volumes:
      - workbench_data:/data
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/workbench", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workbench}
      POSTGRES_USER: ${POSTGRES_USER:-workbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workbench-local}
    command: ["postgres", "-p", "${POSTGRES_PORT:-5432}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-workbench}", "-d", "${POSTGRES_DB:-workbench}", "-p", "${POSTGRES_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  workbench_data:
  postgres_data:
