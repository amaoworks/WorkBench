<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投资终端</title>
  <style>
    html, body { margin: 0; height: 100%; background: var(--terminal-background, #fff); }
    html { color-scheme: light dark; }
    #tv_chart_container { height: 100%; }
    #session-toast { position: fixed; z-index: 15000; left: 50%; bottom: 36px; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 12px; border-radius: 6px; background: CanvasText; color: Canvas; box-shadow: 0 2px 12px #0004; font: 13px/1.5 system-ui, sans-serif; text-align: center; }
    #session-toast[hidden] { display: none; }
    #terminal-loading { position: fixed; inset: 0; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; font: 14px/1.6 system-ui, sans-serif; background: var(--terminal-background, Canvas); color: CanvasText; }
    #terminal-loading[hidden] { display: none; }
    #terminal-loading-title { margin: 0; font-size: 18px; }
    #terminal-retry { padding: 10px 18px; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    #watchlist-status { position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 21000; padding: 10px 14px; background: #fff3cd; color: #664d03; border-radius: 6px; font: 14px/1.6 system-ui, sans-serif; }
    #watchlist-retry { margin-left: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="terminal-loading" role="status" aria-live="polite">
    <h1 id="terminal-loading-title">正在加载图表…</h1>
    <p id="terminal-loading-message">首次打开可能需要一些时间。</p>
    <div id="terminal-loading-actions" hidden><button id="terminal-retry" type="button">重新加载</button></div>
  </div>
  <div id="stream-status" role="status" style="position:fixed;top:0;left:0;right:0;z-index:10000;background:#fff3cd;color:#664d03;padding:8px;text-align:center">正在连接 Schwab，实时行情与订单状态等待更新…</div>
  <div id="session-toast" role="status" aria-live="polite" hidden></div>
  <div id="tv_chart_container"></div>
  <div id="watchlist-status" role="alert" hidden><span id="watchlist-message"></span><button id="watchlist-retry" type="button">重试保存</button></div>
  <script src="/investment/terminal/loading.js"></script>
  <script type="module">
    import { widget as tvWidget } from "/charting_library/charting_library.esm.js";
    import Datafeed from "/investment/terminal/datafeed.js";
    import Broker from "/investment/terminal/broker.js";
    import { SchwabStream } from "/investment/terminal/stream.js";
    import { EQUITY_24H_SESSION, FutuStream, NIGHT_RESOLUTIONS } from "/investment/terminal/futu.js";
    import { createSessionMenu } from "/investment/terminal/session-menu.js";
    import { bindTheme } from "/investment/terminal/theme.js";
    import { loadWatchlists, bindWatchlists } from "/investment/terminal/watchlists.js";
    import { loadChartState, saveChartState, requiresMinuteResolution } from "/investment/terminal/chart-state.js";

    const params = new URLSearchParams(location.search);
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    const initialChartState = loadChartState();
    window.ws = new SchwabStream();
    window.futu = new FutuStream();
    const status = document.getElementById('stream-status');
    window.addEventListener('SCHWAB_STREAM_READY', () => { status.hidden = true; });
    window.addEventListener('SCHWAB_STREAM_CLOSED', () => {
      status.hidden = false;
      window.parent.postMessage({ type: 'workbench.schwab.status_changed' }, location.origin);
    });
    let broker, widget, unbindTheme, watchlistSync, sessionMenu, intervalSubscription, symbolSubscription, sessionResolutionTimer, sessionToastTimer, disposed = false, chartInitialized = false;
    let resolvedSession = initialChartState.session, pendingSession = null, latestSessionResolution;
    const sessionToast = document.getElementById('session-toast');
    const showSessionToast = message => {
      clearTimeout(sessionToastTimer);
      sessionToast.textContent = message;
      sessionToast.hidden = false;
      sessionToastTimer = setTimeout(() => { sessionToast.hidden = true; }, 2600);
    };
    const sessionLabel = session => session === EQUITY_24H_SESSION ? '全天' : session === 'extended' ? '扩展' : '夜盘';
    const intervalNotice = session => session === EQUITY_24H_SESSION
      ? '全天行情仅支持 1、5、15、30 分钟，已切换到 5 分钟'
      : session === 'extended' ? '扩展行情已切换到 5 分钟' : '夜盘仅支持 1、5、15、30 分钟，已切换到 5 分钟';
    const persistChartState = () => {
      if (!chartInitialized || disposed) return;
      const chart = widget.activeChart();
      saveChartState({ symbol: chart.symbol(), resolution: String(chart.resolution()), session: activeSession() });
    };
    const ensureSessionResolution = session => {
      if (!requiresMinuteResolution(session) || NIGHT_RESOLUTIONS.has(String(widget.activeChart().resolution()))) return;
      void widget.activeChart().setResolution('5').then(() => {
        if (disposed || activeSession() !== session) return;
        showSessionToast(widget.activeChart().resolution() === '5'
          ? intervalNotice(session)
          : `无法自动切换${sessionLabel(session)}周期，请选择 1、5、15、30 分钟`);
        persistChartState();
      }).catch(error => {
        if (!disposed && activeSession() === session) showSessionToast(`无法自动切换${sessionLabel(session)}周期，请选择 1、5、15、30 分钟`);
        console.error('切换行情周期失败', error);
      });
    };
    const activeSession = () => pendingSession || resolvedSession;
    const selectSession = session => {
      if (!widget || disposed) return;
      if (session === activeSession() && (!requiresMinuteResolution(session) || NIGHT_RESOLUTIONS.has(String(widget.activeChart().resolution())))) return;
      pendingSession = session;
      clearTimeout(sessionResolutionTimer);
      widget.applyOverrides({ 'mainSeriesProperties.sessionId': session });
      ensureSessionResolution(session);
      persistChartState();
    };
    const onSymbolChanged = symbolInfo => {
      if (disposed) return;
      const desiredSession = activeSession();
      const interval = String(widget.activeChart().resolution());
      // TV can resolve regular metadata while changing to a daily interval.
      // Preserve the requested intraday session until its interval is corrected.
      if (requiresMinuteResolution(desiredSession) && !NIGHT_RESOLUTIONS.has(interval) &&
          symbolInfo.subsessions?.some(item => item.id === desiredSession)) {
        pendingSession = desiredSession;
        onIntervalChanged(interval);
        return;
      }
      if (pendingSession && (symbolInfo.subsession_id || 'regular') !== pendingSession &&
          symbolInfo.subsessions?.some(item => item.id === pendingSession)) return;
      // TradingView may reuse cached symbol metadata without calling the datafeed
      // again. Follow the chart event as well so RTH → Night → ETH → RTH stays in sync.
      resolvedSession = symbolInfo.subsession_id || 'regular';
      pendingSession = null;
      sessionMenu?.setResolvedSession(
        resolvedSession,
        symbolInfo.subsessions?.some(item => item.id === 'night'),
        symbolInfo.subsessions?.some(item => item.id === EQUITY_24H_SESSION),
      );
      clearTimeout(sessionResolutionTimer);
      persistChartState();
    };
    const savedWatchlists = loadWatchlists().then(value => ({ value }), error => ({ error }));
    const datafeed = new Datafeed({ futuStream: window.futu, onSessionResolved: resolution => {
      if (disposed) return;
      const symbolKey = value => String(value || '').trim().split(':').at(-1);
      try {
        const activeSymbol = widget?.activeChart().symbol();
        if (activeSymbol && symbolKey(activeSymbol) !== symbolKey(resolution.symbol)) return;
      } catch { /* TradingView may resolve the first symbol before activeChart is ready. */ }
      // Watchlists can resolve the chart's symbol in regular hours independently.
      // Ignore those callbacks and old menu choices even after a switch completes.
      if (resolution.requestedSession !== activeSession()) return;
      latestSessionResolution = resolution;
      resolvedSession = resolution.session;
      if (pendingSession === resolution.requestedSession) pendingSession = null;
      sessionMenu?.setResolvedSession(resolution.session, resolution.nightAvailable, resolution.fullDayAvailable);
      // The saved session can outlive the overnight switch or a change to a non-equity symbol.
      if ((resolution.requestedSession === 'night' && !resolution.nightAvailable) ||
          (resolution.requestedSession === EQUITY_24H_SESSION && !resolution.fullDayAvailable)) {
        pendingSession = null;
        resolvedSession = 'regular';
        widget.applyOverrides({ 'mainSeriesProperties.sessionId': 'regular' });
        showSessionToast(`当前标的不支持${resolution.requestedSession === EQUITY_24H_SESSION ? '全天行情' : '夜盘'}，已切回常规时段`);
      }
      persistChartState();
    }, resetCharts: () => {
      widget.chartReady().then(() => {
        if (disposed || !window.ws.ready) return;
        widget.resetCache();
        for (let i = 0; i < widget.chartsCount(); i++) widget.chart(i).resetData();
      }).catch(() => { status.hidden = false; });
    } });
    window.addEventListener('pagehide', () => {
      persistChartState();
      disposed = true;
      clearTimeout(sessionResolutionTimer);
      clearTimeout(sessionToastTimer);
      intervalSubscription?.unsubscribe(null, onIntervalChanged);
      symbolSubscription?.unsubscribe(null, onSymbolChanged);
      sessionMenu?.dispose();
      unbindTheme?.(); watchlistSync?.dispose(); window.ws.close(); window.futu.close(); datafeed.destroy(); broker?.destroy();
    });
    const onIntervalChanged = interval => {
      if (!requiresMinuteResolution(activeSession()) || NIGHT_RESOLUTIONS.has(String(interval))) {
        persistChartState();
        return;
      }
      // Let TradingView finish the current interval change before correcting it.
      clearTimeout(sessionResolutionTimer);
      sessionResolutionTimer = setTimeout(() => {
        const session = activeSession();
        if (disposed || !requiresMinuteResolution(session) || NIGHT_RESOLUTIONS.has(String(widget.activeChart().resolution()))) return;
        selectSession(session);
      }, 200);
    };

    widget = new tvWidget({
      datafeed,
      container: "tv_chart_container",
      library_path: "/charting_library/quotes-v1/",
      custom_css_url: "/investment/terminal/custom.css",
      symbol: params.get("symbol") || initialChartState.symbol,
      interval: initialChartState.resolution,
      overrides: { 'mainSeriesProperties.sessionId': initialChartState.session },
      theme,
      locale: "zh",
      custom_translate_function: (originalText) => {
        switch (originalText) {
          case "Time in force": return "有效期";
          case "Overnight via BOATS": return "夜盘";
          case "Market open": return "盘中";
          default: return null;
        }
      },
      timezone: "Asia/Shanghai",
      symbol_search_request_delay: 1000,
      fullscreen: false,
      autosize: true,
      disabled_features: ["header_saveload", "study_templates"],
      enabled_features: ["pre_post_market_sessions", "iframe_loading_same_origin"],
      widgetbar: { details: true, watchlist: true, news: false, datawindow: true },
      broker_factory: function (host) { broker = new Broker(host); return broker; },
      broker_config: {
        durations: [
          { name: "DAY(当天有效)", value: "DAY", default: true },
          { name: "GTC(取消前有效)", value: "GTC" },
          { name: "FOK(立即全部成交，否则取消)", value: "FOK", supportedOrderTypes: [1] },
          { name: "IOC(立即成交，否则取消)", value: "IOC", supportedOrderTypes: [1] }
        ],
        configFlags: {
          supportReversePosition: false,
          supportPositions: true,
          supportStopLimitOrders: true,
          supportOrdersHistory: true,
          supportExecutions: true
        }
      }
    });
    sessionMenu = createSessionMenu(widget, {
      onSelect: selectSession,
      onError: error => console.error('创建行情时段菜单失败', error),
    });
    if (latestSessionResolution) sessionMenu.setResolvedSession(latestSessionResolution.session, latestSessionResolution.nightAvailable, latestSessionResolution.fullDayAvailable);
    unbindTheme = bindTheme(widget, theme);
    const showWatchlistError = message => {
      const panel = document.getElementById('watchlist-status');
      panel.hidden = false;
      document.getElementById('watchlist-message').textContent = message;
    };
    widget.chartReady().then(async () => {
      if (disposed) return;
      intervalSubscription = widget.activeChart().onIntervalChanged();
      intervalSubscription.subscribe(null, onIntervalChanged);
      symbolSubscription = widget.activeChart().onSymbolChanged();
      symbolSubscription.subscribe(null, onSymbolChanged);
      chartInitialized = true;
      onSymbolChanged(widget.activeChart().symbolExt());
      // The chart can paint before watchlist restoration. Keeping the cover up
      // waits on another widget bundle and hides an already drawn chart.
      window.terminalLoad.ready();
      const saved = await savedWatchlists;
      if (disposed) return;
      if (saved.error) {
        showWatchlistError(saved.error.message);
        return;
      }
      try {
        watchlistSync = await bindWatchlists(widget, saved.value, error => {
          const panel = document.getElementById('watchlist-status');
          panel.hidden = !error;
          if (!error) return;
          document.getElementById('watchlist-message').textContent = error.message;
          const retry = document.getElementById('watchlist-retry');
          retry.textContent = error.conflict ? '加载工作台版本' : '重试保存';
          retry.onclick = () => { if (error.conflict) { watchlistSync?.dispose({ discard: true }); saved.value.discardDraft(); location.reload(); } else void watchlistSync?.retry(); };
        });
      } catch (error) {
        showWatchlistError(error.message);
        return;
      }
      if (disposed) watchlistSync.dispose();
    }).catch(error => window.terminalLoad.fail(error.message));
  </script>
</body>
</html>
