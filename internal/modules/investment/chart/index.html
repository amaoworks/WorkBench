<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>投资终端</title>
  <style>
    html, body, #tv_chart_container { margin: 0; height: 100%; background: var(--terminal-background, #fff); }
    html { color-scheme: light dark; }
    #terminal-loading { position: fixed; inset: 0; z-index: 20000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; font: 14px/1.6 system-ui, sans-serif; background: var(--terminal-background, Canvas); color: CanvasText; }
    #terminal-loading[hidden] { display: none; }
    #terminal-loading-title { margin: 0; font-size: 18px; }
    #terminal-retry { padding: 10px 18px; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    #watchlist-status { position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 21000; padding: 10px 14px; background: #fff3cd; color: #664d03; border-radius: 6px; font: 14px/1.6 system-ui, sans-serif; }
    #watchlist-retry { margin-left: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="terminal-loading" role="status" aria-live="polite">
    <h1 id="terminal-loading-title">正在加载图表…</h1>
    <p id="terminal-loading-message">首次打开可能需要一些时间。</p>
    <div id="terminal-loading-actions" hidden><button id="terminal-retry" type="button">重新加载</button></div>
  </div>
  <div id="stream-status" role="status" style="position:fixed;top:0;left:0;right:0;z-index:10000;background:#fff3cd;color:#664d03;padding:8px;text-align:center">正在连接 Schwab，实时行情与订单状态等待更新…</div>
  <div id="tv_chart_container"></div>
  <div id="watchlist-status" role="alert" hidden><span id="watchlist-message"></span><button id="watchlist-retry" type="button">重试保存</button></div>
  <script src="/investment/terminal/loading.js"></script>
  <script type="module">
    import { widget as tvWidget } from "/charting_library/charting_library.esm.js";
    import Datafeed from "/investment/terminal/datafeed.js";
    import Broker from "/investment/terminal/broker.js";
    import { SchwabStream } from "/investment/terminal/stream.js";
    import { FutuStream } from "/investment/terminal/futu.js";
    import { bindTheme } from "/investment/terminal/theme.js";
    import { loadWatchlists, bindWatchlists } from "/investment/terminal/watchlists.js";

    const params = new URLSearchParams(location.search);
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    window.ws = new SchwabStream();
    window.futu = new FutuStream();
    const status = document.getElementById('stream-status');
    window.addEventListener('SCHWAB_STREAM_READY', () => { status.hidden = true; });
    window.addEventListener('SCHWAB_STREAM_CLOSED', () => {
      status.hidden = false;
      window.parent.postMessage({ type: 'workbench.schwab.status_changed' }, location.origin);
    });
    let broker, widget, unbindTheme, watchlistSync, disposed = false;
    const savedWatchlists = loadWatchlists().then(value => ({ value }), error => ({ error }));
    const datafeed = new Datafeed({ futuStream: window.futu, resetCharts: () => {
      widget.chartReady().then(() => {
        if (disposed || !window.ws.ready) return;
        widget.resetCache();
        for (let i = 0; i < widget.chartsCount(); i++) widget.chart(i).resetData();
      }).catch(() => { status.hidden = false; });
    } });
    window.addEventListener('pagehide', () => { disposed = true; unbindTheme?.(); watchlistSync?.dispose(); window.ws.close(); window.futu.close(); datafeed.destroy(); broker?.destroy(); });

    widget = new tvWidget({
      datafeed,
      container: "tv_chart_container",
      library_path: "/charting_library/",
      symbol: params.get("symbol") || "AAPL",
      interval: "1D",
      theme,
      locale: "zh",
      custom_translate_function: (originalText) => originalText === "Time in force" ? "有效期" : null,
      timezone: "Asia/Shanghai",
      symbol_search_request_delay: 1000,
      fullscreen: false,
      autosize: true,
      disabled_features: ["header_saveload", "study_templates"],
      enabled_features: ["pre_post_market_sessions", "iframe_loading_same_origin"],
      widgetbar: { details: true, watchlist: true, news: false, datawindow: true },
      broker_factory: function (host) { broker = new Broker(host); return broker; },
      broker_config: {
        durations: [
          { name: "DAY(当天有效)", value: "DAY", default: true },
          { name: "GTC(取消前有效)", value: "GTC" },
          { name: "FOK(立即全部成交，否则取消)", value: "FOK", supportedOrderTypes: [1] },
          { name: "IOC(立即成交，否则取消)", value: "IOC", supportedOrderTypes: [1] }
        ],
        configFlags: {
          supportReversePosition: false,
          supportPositions: true,
          supportStopLimitOrders: true,
          supportOrdersHistory: true,
          supportExecutions: true
        }
      }
    });
    unbindTheme = bindTheme(widget, theme);
    widget.chartReady().then(async () => {
      const saved = await savedWatchlists;
      if (disposed) return;
      if (saved.error) throw saved.error;
      watchlistSync = await bindWatchlists(widget, saved.value, error => {
        const panel = document.getElementById('watchlist-status');
        panel.hidden = !error;
        if (!error) return;
        document.getElementById('watchlist-message').textContent = error.message;
        const retry = document.getElementById('watchlist-retry');
        retry.textContent = error.conflict ? '加载工作台版本' : '重试保存';
        retry.onclick = () => { if (error.conflict) { watchlistSync?.dispose({ discard: true }); saved.value.discardDraft(); location.reload(); } else void watchlistSync?.retry(); };
      });
      if (disposed) { watchlistSync.dispose(); return; }
      window.terminalLoad.ready();
    }).catch(error => window.terminalLoad.fail(error.message));
  </script>
</body>
</html>
