# Overlay onto the workbench compose file so OpenD and workbench share a network.
# From the workbench repo root:
#   docker compose -f compose.yaml -f futu-opend/compose.workbench.yaml --env-file futu-opend/.env up --build
#
# Then in 设置 → 投资: OpenD host `futu-opend`, port `11111`, enable overlay,
# and allow non-loopback host.
services:
  futu-opend:
    build:
      context: ./futu-opend
    restart: unless-stopped
    environment:
      FUTU_ACCOUNT_ID: ${FUTU_ACCOUNT_ID:?Set FUTU_ACCOUNT_ID}
      FUTU_ACCOUNT_PWD_MD5: ${FUTU_ACCOUNT_PWD_MD5:?Set FUTU_ACCOUNT_PWD_MD5}
      FUTU_OPEND_VER: ${FUTU_OPEND_VER:-10.10.7008}
      FUTU_OPEND_IP: 0.0.0.0
      FUTU_OPEND_PORT: 11111
      FUTU_OPEND_TELNET_PORT: 22222
      FUTU_LANG: ${FUTU_LANG:-chs}
      FUTU_LOG_LEVEL: ${FUTU_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:22222:22222"
    volumes:
      - futu_opend_bin:/opt/FutuOpenD
      - futu_opend_data:/home/futu/.com.futunn.FutuOpenD
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/11111'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  futu_opend_bin:
  futu_opend_data:
