# Overlay onto the workbench compose file so OpenD and workbench share a network.
# From the workbench repo root:
#   docker compose -f compose.yaml -f futu-opend/compose.workbench.yaml --env-file .env up --build
#
# Configure Futu login and overnight in 设置 → 业务模块 → 投资设置.
services:
  workbench:
    environment:
      WORKBENCH_FUTU_CONFIG_DIR: /run/workbench-futu
      WORKBENCH_FUTU_OPEND_ADDRESS: futu-opend:11111
      WORKBENCH_FUTU_ALLOW_NON_LOCAL: "true"
    volumes:
      - futu_login:/run/workbench-futu
  futu-opend:
    build:
      context: ./futu-opend
    restart: unless-stopped
    environment:
      FUTU_LOGIN_CONFIG: /run/workbench-futu/login.json
      FUTU_OPEND_VER: ${FUTU_OPEND_VER:-10.9.6908}
      FUTU_OPEND_IP: 0.0.0.0
      FUTU_OPEND_PORT: 11111
      FUTU_OPEND_TELNET_PORT: 22222
      FUTU_LANG: ${FUTU_LANG:-chs}
      FUTU_LOG_LEVEL: ${FUTU_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:22222:22222"
    volumes:
      - futu_opend_bin:/opt/FutuOpenD
      - futu_opend_data:/home/futu/.com.futunn.FutuOpenD
      - futu_login:/run/workbench-futu:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/11111'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 5

volumes:
  futu_opend_bin:
  futu_opend_data:
  futu_login:
