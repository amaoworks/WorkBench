services:
  workbench:
    image: ${WORKBENCH_IMAGE:-ghcr.io/amaoworks/workbench}:${WORKBENCH_VERSION:?Set WORKBENCH_VERSION to a published release tag}
    restart: unless-stopped
    environment:
      WORKBENCH_LISTEN: 0.0.0.0:8080
      WORKBENCH_DATA: /data/data.db
      WORKBENCH_AUTH: password
      WORKBENCH_PUBLIC_URL: ${WORKBENCH_PUBLIC_URL:?Set WORKBENCH_PUBLIC_URL to the HTTPS reverse proxy origin}
      WORKBENCH_PASSWORD: ${WORKBENCH_PASSWORD:-}
      WORKBENCH_LOG_LEVEL: ${WORKBENCH_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${WORKBENCH_PORT:-8080}:8080"
    volumes:
      - workbench_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/workbench", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  workbench_data:
