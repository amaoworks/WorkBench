name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  on-main:
    name: Require commit on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit=$(git rev-parse 'HEAD^{commit}')
          main=$(git rev-parse refs/remotes/origin/main)
          if ! git merge-base --is-ancestor "$commit" "$main"; then
            printf '%s\n' \
              'Release packages can only be published from commits already on main.' \
              "Tagged commit ${commit} is not contained in origin/main (${main})." >&2
            exit 1
          fi
          printf 'Release commit %s is on main (%s).\n' "$commit" "$main"

  check:
    needs: on-main
    uses: ./.github/workflows/ci.yml

  packages:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workbench-linux-amd64-${{ github.sha }}
          path: builds/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workbench-linux-arm64-${{ github.sha }}
          path: builds/arm64
      - name: Package verified Linux releases
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/builds
        run: ./scripts/release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-packages
          path: dist/release/${{ github.ref_name }}/
          if-no-files-found: error
          compression-level: 0

  image:
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build-info.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read build metadata
        id: build-info
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workbench-linux-amd64-${{ github.sha }}
          path: builds/amd64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: workbench-linux-arm64-${{ github.sha }}
          path: builds/arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified images and assemble multi-platform manifest
        id: push
        env:
          IMAGE: ${{ steps.build-info.outputs.image }}
          VERSION: ${{ github.ref_name }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            (cd "builds/$arch" && sha256sum --check SHA256SUMS)
            docker load --input "builds/$arch/workbench_${VERSION}_linux_${arch}_docker.tar.gz"
            local_image="workbench:sha-${GITHUB_SHA}-${arch}"
            image_arch=$(docker image inspect "$local_image" --format '{{.Architecture}}')
            test "$image_arch" = "$arch"
            target="${IMAGE}:sha-${GITHUB_SHA}-${arch}"
            docker tag "$local_image" "$target"
            docker push "$target"
            sources+=("$target")
          done
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:sha-${GITHUB_SHA}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  publish:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: packages
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: bash ./scripts/publish-release.sh packages
