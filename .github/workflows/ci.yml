name: CI and Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check workflows and shell scripts
        run: ./scripts/check-workflows.sh -color
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install sqlc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/sqlc"
          gh release download v1.31.1 --repo sqlc-dev/sqlc --dir "$RUNNER_TEMP/sqlc" \
            --pattern sqlc_1.31.1_linux_amd64.tar.gz
          cd "$RUNNER_TEMP/sqlc"
          # SHA256 published on the v1.31.1 GitHub release asset.
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  sqlc_1.31.1_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf sqlc_1.31.1_linux_amd64.tar.gz sqlc
          echo "$RUNNER_TEMP/sqlc" >> "$GITHUB_PATH"
      - run: npm ci --prefix web
      - name: Test and build
        run: ./scripts/test.sh
      - name: Check deployment concurrency
        run: go test -race ./cmd/workbench ./internal/app ./internal/foundation/auth

  build:
    name: Build linux/${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Read build metadata
        id: info
        run: |
          version="v0.0.0-dev.${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          {
            echo "version=$version"
            echo "image=workbench:sha-${GITHUB_SHA}"
            echo "go=$(awk '$1 == "go" {print $2}' go.mod)"
            echo "date=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ steps.info.outputs.image }}
          build-args: |
            GO_VERSION=${{ steps.info.outputs.go }}
            VERSION=${{ steps.info.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.info.outputs.date }}
          cache-from: type=gha,scope=workbench-${{ matrix.arch }}
          cache-to: type=gha,scope=workbench-${{ matrix.arch }},mode=max
      - name: Verify Compose lifecycle and data
        env:
          IMAGE: ${{ steps.info.outputs.image }}
        run: python3 scripts/deployment-smoke.py --image "$IMAGE"
      - name: Export binary and Docker image
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/export-build.sh
      - name: Verify exported binary
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        env:
          VERSION: ${{ steps.info.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cd dist/build
          sha256sum --check SHA256SUMS
          tar -xzf "workbench_${VERSION}_linux_${ARCH}.tar.gz"
          cd ../..
          python3 scripts/deployment-smoke.py --binary "dist/build/workbench_${VERSION}_linux_${ARCH}/workbench"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request' && github.ref_type != 'tag'
        with:
          name: workbench-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            dist/build/*.tar.gz
            dist/build/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
